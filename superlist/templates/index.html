<!doctype html>
<html lang="es">

<head>
  {% include 'partials/_head.html' with context %}
</head>

<body>

  {% include 'partials/_header.html' %}

  <main class="list-container">
    <section class="card list-card">

      <!-- Header -->
      <div class="list-header">
        <h1>
          <i class="fa-solid fa-list"></i>
          Lista de Compras
        </h1>
        <span class="list-count" id="item-count">0</span>
      </div>

      <!-- Add form -->
      <form id="add-form" novalidate autocomplete="off">
        <div class="form-group">
          <input type="text" name="name" placeholder="Añadir producto..." aria-label="Nombre del producto" required />
          <button type="submit" class="btn btn-primary">
            <i class="fa-solid fa-plus"></i>
            Añadir
          </button>
        </div>
      </form>

      <!-- Item list -->
      <ul id="item-list" role="list" aria-live="polite"></ul>

      <!-- Budget strip -->
      <div class="budget-strip" id="budget-strip">
        <div class="budget-strip-info">
          <span class="budget-strip-total" id="budget-strip-total">$0.00</span>
          <div class="progress-bar-wrap budget-strip-bar">
            <div class="progress-bar" id="budget-progress"></div>
          </div>
          <span class="budget-strip-summary" id="budget-strip-summary" aria-live="polite"></span>
        </div>
        <button class="budget-strip-btn" id="budget-toggle-btn" title="Fijar presupuesto" aria-expanded="false">
          <i class="fa-solid fa-sliders"></i>
        </button>
      </div>

      <!-- Budget inline panel -->
      <div id="budget-panel" class="inline-panel" hidden>
        <form id="budget-form" novalidate autocomplete="off">
          <div class="form-group">
            <input type="number" id="budget-input" name="budget" step="0.01" min="0"
              placeholder="Ingresa tu presupuesto..." aria-label="Presupuesto" />
            <button type="submit" class="btn btn-primary">Fijar</button>
          </div>
        </form>
      </div>

      <!-- List actions -->
      <div class="list-actions">
        <button id="reset-btn" type="button" aria-label="Limpiar lista">
          <i class="fa-solid fa-trash"></i>
          Limpiar todo
        </button>
        <button id="save-toggle-btn" type="button" class="btn btn-sm btn-primary">
          <i class="fa-solid fa-floppy-disk"></i>
          Guardar compra
        </button>
      </div>

      <!-- Save purchase inline panel -->
      <div id="save-panel" class="inline-panel" hidden>
        <form id="save-purchase-form" autocomplete="off">
          <div class="form-group">
            <input type="text" name="purchase_name" placeholder="Nombre de la compra (ej: Semanal)" aria-label="Nombre de la compra" required />
            <button type="submit" class="btn btn-primary">
              <i class="fa-solid fa-check"></i>
              Guardar
            </button>
          </div>
        </form>
      </div>

    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const API_BASE = '';

      const fetchData = async () => {
        try {
          const res = await fetch(`${API_BASE}/data`);
          if (!res.ok) throw new Error();
          render(await res.json());
        } catch {
          document.getElementById('item-list').innerHTML =
            '<li class="empty-list-message"><i class="fa-solid fa-triangle-exclamation empty-icon"></i>Error al cargar.</li>';
        }
      };

      const postData = async (url, body) => {
        try {
          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          if (!res.ok) throw new Error();
          return await res.json();
        } catch {
          return null;
        }
      };

      const render = (data) => {
        renderItems(data.items);
        renderBudgetStrip(data.total, data.budget, data.diff);
      };

      const ICON_UNCHECKED = `<i class="fa-regular fa-circle"></i>`;
      const ICON_CHECKED   = `<i class="fa-solid fa-check"></i>`;
      const ICON_DELETE    = `<i class="fa-solid fa-xmark"></i>`;
      const ICON_SAVE      = `<i class="fa-solid fa-floppy-disk"></i>`;
      const ICON_EDIT      = `<i class="fa-solid fa-pen"></i>`;

      // ── Items ──
      const renderItems = (items) => {
        const list    = document.getElementById('item-list');
        const countEl = document.getElementById('item-count');
        if (countEl) countEl.textContent = items ? items.length : 0;

        items = [...items].sort((a, b) => a.checked - b.checked);

        list.innerHTML = '';
        if (!items || items.length === 0) {
          list.innerHTML = `
            <li class="empty-list-message">
              <i class="fa-solid fa-cart-shopping empty-icon"></i>
              Tu lista está vacía. ¡Añade productos!
            </li>`;
          return;
        }

        items.forEach(item => {
          const li = document.createElement('li');
          const hasSavedPrice = item.checked && item.price > 0;
          li.className = `item-row${item.checked ? ' is-checked' : ''}${hasSavedPrice ? ' is-compact' : ''}`;
          li.dataset.itemId = item.id;

          let checkedExtra = '';
          if (item.checked) {
            if (hasSavedPrice) {
              const subtotal = (item.price * item.quantity).toFixed(2);
              const qtyLabel = item.quantity > 1 ? `${item.quantity} × ` : '';
              checkedExtra = `
                <span class="item-subtotal" data-qty="${item.quantity}" data-price="${item.price}">${qtyLabel}$${subtotal}</span>
                <button class="edit-price-btn" title="Editar precio">${ICON_EDIT}</button>`;
            } else {
              checkedExtra = `
                <form class="set-price-form" autocomplete="off" novalidate>
                  <input type="number" step="1" min="1" name="quantity" value="${item.quantity || 1}" aria-label="Cantidad" />
                  <span>×</span>
                  <input type="number" step="0.01" min="0" name="price" value="${item.price || ''}" placeholder="0.00" aria-label="Precio" />
                  <span>$/u</span>
                  <button type="submit" title="Guardar precio">${ICON_SAVE}</button>
                </form>`;
            }
          }

          li.innerHTML = `
            <button class="check-btn${item.checked ? ' checked' : ''}" aria-pressed="${item.checked}"
              title="${item.checked ? 'Desmarcar' : 'Marcar como comprado'}">
              ${item.checked ? ICON_CHECKED : ICON_UNCHECKED}
            </button>
            <span class="item-name${item.checked ? ' comprado' : ''}">${item.name}</span>
            ${checkedExtra}
            <button class="delete-btn" aria-label="Eliminar ${item.name}" title="Eliminar">${ICON_DELETE}</button>
          `;
          list.appendChild(li);
        });
      };

      // ── Budget strip ──
      const renderBudgetStrip = (total, budget, diff) => {
        document.getElementById('budget-strip-total').textContent = `$${total.toFixed(2)}`;

        const budgetInput = document.getElementById('budget-input');
        if (document.activeElement !== budgetInput) {
          budgetInput.value = budget > 0 ? budget.toFixed(2) : '';
        }

        const bar = document.getElementById('budget-progress');
        const summary = document.getElementById('budget-strip-summary');

        if (budget > 0) {
          const pct = Math.min((total / budget) * 100, 100);
          bar.style.width = `${pct}%`;
          bar.className = 'progress-bar' + (pct >= 100 ? ' over-budget' : pct >= 80 ? ' near-budget' : '');

          if (diff >= 0) {
            summary.innerHTML = `<span class="strip-ok">Restan $${diff.toFixed(2)}</span>`;
          } else {
            summary.innerHTML = `<span class="strip-over">+$${(-diff).toFixed(2)}</span>`;
          }
        } else {
          bar.style.width = '0%';
          bar.className = 'progress-bar';
          summary.innerHTML = `<span class="strip-hint">Sin presupuesto</span>`;
        }
      };

      // ── Panel toggles ──
      const budgetPanel  = document.getElementById('budget-panel');
      const savePanel    = document.getElementById('save-panel');
      const budgetToggle = document.getElementById('budget-toggle-btn');
      const saveToggle   = document.getElementById('save-toggle-btn');

      function togglePanel(panel, btn, otherPanel) {
        const isOpen = !panel.hidden;
        if (otherPanel) otherPanel.hidden = true;
        panel.hidden = isOpen;
        if (btn) btn.setAttribute('aria-expanded', String(!isOpen));
        if (!isOpen) panel.querySelector('input')?.focus();
      }

      budgetToggle.addEventListener('click', () => togglePanel(budgetPanel, budgetToggle, savePanel));
      saveToggle.addEventListener('click',   () => togglePanel(savePanel, saveToggle, budgetPanel));

      // ── Add item ──
      document.getElementById('add-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const input = e.target.elements.name;
        const name  = input.value.trim();
        if (name) {
          await postData(`${API_BASE}/add`, { name });
          input.value = '';
          fetchData();
        }
      });

      // ── Reset ──
      document.getElementById('reset-btn').addEventListener('click', async () => {
        if (confirm('¿Limpiar toda la lista y el presupuesto?')) {
          await postData(`${API_BASE}/reset`, {});
          fetchData();
        }
      });

      // ── Item list clicks ──
      document.getElementById('item-list').addEventListener('click', async (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        const li = btn.closest('.item-row');
        if (!li) return;
        const id = li.dataset.itemId;

        if (btn.classList.contains('check-btn')) {
          await postData(`${API_BASE}/check/${id}`, {});
          fetchData();
        } else if (btn.classList.contains('delete-btn')) {
          await postData(`${API_BASE}/delete/${id}`, {});
          fetchData();
        } else if (btn.classList.contains('edit-price-btn')) {
          const subtotal = li.querySelector('.item-subtotal');
          const qty      = subtotal.dataset.qty   || '1';
          const price    = subtotal.dataset.price || '';
          subtotal.remove();
          btn.remove();
          li.classList.remove('is-compact');
          const form = document.createElement('form');
          form.className  = 'set-price-form';
          form.noValidate = true;
          form.innerHTML  = `
            <input type="number" step="1" min="1" name="quantity" value="${qty}" aria-label="Cantidad" />
            <span>×</span>
            <input type="number" step="0.01" min="0" name="price" value="${price}" placeholder="0.00" aria-label="Precio" />
            <span>$/u</span>
            <button type="submit" title="Guardar precio">${ICON_SAVE}</button>
          `;
          li.querySelector('.delete-btn').before(form);
          form.querySelector('input[name="price"]').focus();
        }
      });

      // ── Price form submit ──
      document.getElementById('item-list').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!e.target.classList.contains('set-price-form')) return;
        const li       = e.target.closest('.item-row');
        const id       = li.dataset.itemId;
        const price    = e.target.elements.price.value;
        const quantity = e.target.elements.quantity.value;
        await postData(`${API_BASE}/set_price/${id}`, { price, quantity });
        fetchData();
      });

      // ── Budget form ──
      document.getElementById('budget-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const budget = e.target.elements.budget.value;
        await postData(`${API_BASE}/set_budget`, { budget });
        budgetPanel.hidden = true;
        budgetToggle.setAttribute('aria-expanded', 'false');
        fetchData();
      });

      // ── Save purchase ──
      document.getElementById('save-purchase-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const purchase_name = e.target.elements.purchase_name.value.trim();
        if (!purchase_name) return;
        const data = await postData(`${API_BASE}/save_purchase`, { purchase_name });
        if (data?.redirect_url) {
          window.location.href = data.redirect_url;
        } else {
          fetchData();
        }
      });

      fetchData();
    });
  </script>
</body>

</html>
